name: Feature request
description: Suggest a focused user-facing improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would a good workflow look like?
    validations:
      required: true
